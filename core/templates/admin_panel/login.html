<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ulsavam SuperAdmin Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --dark: #1f2937;
            --light: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-logo {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        .login-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--dark);
            margin-bottom: 0.5rem;
        }

        .login-subtitle {
            color: #6b7280;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--dark);
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #e5e7eb;
            color: var(--dark);
        }

        .btn-secondary:hover {
            background: #d1d5db;
        }

        .alert {
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1.5rem;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert.error {
            background-color: rgba(239, 68, 68, 0.1);
            color: #dc2626;
            border-left: 4px solid #dc2626;
        }

        .alert.success {
            background-color: rgba(16, 185, 129, 0.1);
            color: #059669;
            border-left: 4px solid #059669;
        }

        .step-indicator {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            justify-content: center;
        }

        .step {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #e5e7eb;
            color: #6b7280;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .step.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            transform: scale(1.1);
        }

        .step.completed {
            background-color: #10b981;
            color: white;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(102, 126, 234, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .info-box {
            background-color: var(--light);
            border-left: 4px solid var(--primary);
            padding: 1rem;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #6b7280;
            margin-top: 1rem;
        }

        @media (max-width: 600px) {
            .login-container {
                margin: 1rem;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="login-logo">👑</div>
            <h1 class="login-title">SuperAdmin Panel</h1>
            <p class="login-subtitle">Ulsavam Administration</p>
        </div>

        <div id="alert" class="alert"></div>

        <!-- Step 1: Email/Phone -->
        <div id="step1" class="step-content">
            <div class="step-indicator">
                <div class="step active">1</div>
                <div class="step">2</div>
            </div>

            <form onsubmit="requestOTP(event)">
                <div class="form-group">
                    <label for="identifier">Email or Phone Number</label>
                    <input
                        type="text"
                        id="identifier"
                        placeholder="admin@example.com or 9876543210"
                        required
                    >
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-primary">
                        Send OTP
                    </button>
                </div>

                <div class="info-box">
                    <strong>Admin Access Only:</strong> Only staff members can log in to this panel.
                </div>
            </form>
        </div>

        <!-- Step 2: OTP Verification -->
        <div id="step2" class="step-content" style="display: none;">
            <div class="step-indicator">
                <div class="step completed">✓</div>
                <div class="step active">2</div>
            </div>

            <form onsubmit="verifyOTP(event)">
                <div class="form-group">
                    <label for="otp">Enter OTP Code</label>
                    <input
                        type="text"
                        id="otp"
                        placeholder="123456"
                        maxlength="6"
                        required
                    >
                </div>

                <p style="font-size: 0.85rem; color: #6b7280; margin-bottom: 1rem;">
                    We've sent a 6-digit code to your email. Enter it below.
                </p>

                <div class="button-group">
                    <button type="submit" class="btn btn-primary">
                        Verify & Login
                    </button>
                    <button type="button" class="btn btn-secondary" onclick="goBackToStep1()">
                        Back
                    </button>
                </div>

                <div class="info-box">
                    <strong>Didn't receive code?</strong> Check your email spam folder or request a new OTP.
                </div>
            </form>
        </div>
    </div>

    <script>
        let userIdentifier = '';

        async function requestOTP(event) {
            event.preventDefault();

            userIdentifier = document.getElementById('identifier').value.trim();
            const button = event.target.querySelector('button[type="submit"]');
            const originalText = button.textContent;

            try {
                button.disabled = true;
                button.innerHTML = '<span class="loading-spinner"></span>Sending...';

                const response = await fetch('/api/auth/otp/request/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        identifier: userIdentifier,
                        method: 'email'
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to send OTP');
                }

                showAlert('OTP sent! Check your email.', 'success');

                // Move to step 2
                document.getElementById('step1').style.display = 'none';
                document.getElementById('step2').style.display = 'block';

            } catch (error) {
                showAlert(error.message, 'error');
            } finally {
                button.disabled = false;
                button.textContent = originalText;
            }
        }

        async function verifyOTP(event) {
            event.preventDefault();

            const otp = document.getElementById('otp').value.trim();
            const button = event.target.querySelector('button[type="submit"]');
            const originalText = button.textContent;

            try {
                button.disabled = true;
                button.innerHTML = '<span class="loading-spinner"></span>Verifying...';

                const response = await fetch('/api/auth/otp/verify/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        identifier: userIdentifier,
                        code: otp
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Invalid OTP');
                }

                // Check if user is staff
                if (!data.user.is_staff) {
                    throw new Error('Only staff members can access the admin panel');
                }

                // Save token and redirect
                localStorage.setItem('adminToken', data.access);
                showAlert('Login successful! Redirecting...', 'success');

                setTimeout(() => {
                    window.location.href = '/superadmin/';
                }, 1500);

            } catch (error) {
                showAlert(error.message, 'error');
            } finally {
                button.disabled = false;
                button.textContent = originalText;
            }
        }

        function goBackToStep1() {
            document.getElementById('step1').style.display = 'block';
            document.getElementById('step2').style.display = 'none';
            document.getElementById('identifier').value = '';
            document.getElementById('otp').value = '';
            clearAlert();
        }

        function showAlert(message, type) {
            const alertEl = document.getElementById('alert');
            alertEl.textContent = message;
            alertEl.className = `alert show ${type}`;
        }

        function clearAlert() {
            const alertEl = document.getElementById('alert');
            alertEl.className = 'alert';
            alertEl.textContent = '';
        }

        // Check if already logged in
        if (localStorage.getItem('adminToken')) {
            window.location.href = '/superadmin/';
        }
    </script>
</body>
</html>
