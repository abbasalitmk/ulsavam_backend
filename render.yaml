services:
  - type: web
    name: ulsavam-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn ulsavam_backend.wsgi:application --bind 0.0.0.0:10000
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        scope: build
        sync: false
